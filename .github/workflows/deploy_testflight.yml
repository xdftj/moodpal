name: Deploy TestFlight
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    env:
      BUNDLE_ID: "com.sai.moodpal"
      TEAM_ID: ${{ secrets.TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GITHUB_URL: ${{ secrets.MATCH_GITHUB_URL }}
      MATCH_GITHUB_TOKEN: ${{ secrets.MATCH_GITHUB_TOKEN }}
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      GIT_AUTHORIZATION: ${{ secrets.MATCH_GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        
      - name: Install Ruby gems
        run: |
          cd ios
          gem install bundler
          bundle init
          bundle add fastlane
          bundle add xcodeproj

      - name: Clean Xcode project settings
        run: |
          cd ios
          cat > fix_project.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          
          # Get environment variables
          team_id = ENV['TEAM_ID']
          bundle_id = ENV['BUNDLE_ID']
          
          puts "Team ID: #{team_id}"
          puts "Bundle ID: #{bundle_id}"
          
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Clean all code signing settings
          project.targets.each do |target|
            puts "Target: #{target.name}"
            target.build_configurations.each do |config|
              puts "Config: #{config.name}"
              
              # Set bundle ID
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
              
              # Remove all signing settings
              config.build_settings.delete('CODE_SIGN_STYLE')
              config.build_settings.delete('CODE_SIGN_IDENTITY')
              config.build_settings.delete('CODE_SIGN_IDENTITY[sdk=iphoneos*]')
              config.build_settings.delete('PROVISIONING_PROFILE')
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
              
              # Set to automatic signing with team ID
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
            end
          end
          
          # Save the changes
          project.save
          puts "Project saved with clean signing settings"
          EOL
          
          chmod +x fix_project.rb
          ruby fix_project.rb

      - name: Skip certificate creation, use existing ones
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios
          mkdir -p fastlane
          
          # Create Fastfile for building without certificate creation
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Set up App Store Connect API key
              api_key = app_store_connect_api_key(
                key_id: "${{ secrets.APPSTORE_API_KEY_ID }}",
                issuer_id: "${{ secrets.APPSTORE_ISSUER_ID }}",
                key_content: ENV['APPSTORE_API_PRIVATE_KEY'],
                duration: 1200,
                in_house: false
              )
              
              # Set up CI environment
              setup_ci
              
              # Let Xcode handle the signing automatically
              update_code_signing_settings(
                use_automatic_signing: true,
                team_id: "$TEAM_ID",
                bundle_identifier: "$BUNDLE_ID",
                profile_name: "",
                code_sign_identity: "iPhone Distribution"
              )
              
              # Build the app with automatic signing and allowing provisioning updates
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                clean: true,
                export_method: "app-store",
                export_team_id: "$TEAM_ID",
                export_options: {
                  method: "app-store",
                  signingStyle: "automatic",
                  teamID: "$TEAM_ID"
                },
                xcargs: "-allowProvisioningUpdates"
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOL
          
          # Create Appfile
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_id("$FASTLANE_USER")
          team_id("$TEAM_ID")
          EOL

      - name: Flutter clean and rebuild
        run: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install

      - name: Deploy to TestFlight
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios
          bundle exec fastlane beta