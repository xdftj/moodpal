name: Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    env:
      BUNDLE_ID: "com.sai.moodPal"
      TEAM_ID: ${{ secrets.TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GITHUB_URL: ${{ secrets.MATCH_GITHUB_URL }}
      MATCH_GITHUB_TOKEN: ${{ secrets.MATCH_GITHUB_TOKEN }}
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      GIT_AUTHORIZATION: ${{ secrets.MATCH_GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        
      - name: Install Ruby gems
        run: |
          cd ios
          gem install bundler
          bundle init
          bundle add fastlane
          bundle add xcodeproj

      - name: Setup fastlane for match only
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios
          mkdir -p fastlane
          
          # Create Appfile
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_id("$FASTLANE_USER")
          team_id("$TEAM_ID")
          EOL
          
          # Create Matchfile
          cat > fastlane/Matchfile << EOL
          git_url("$MATCH_GITHUB_URL")
          storage_mode("git")
          type("appstore")
          app_identifier("$BUNDLE_ID")
          username("$FASTLANE_USER")
          team_id("$TEAM_ID")
          EOL
          
          # Create temporary Fastfile just for running match
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Sync certificates"
            lane :sync_certs do
              # Set up App Store Connect API key
              api_key = app_store_connect_api_key(
                key_id: "${{ secrets.APPSTORE_API_KEY_ID }}",
                issuer_id: "${{ secrets.APPSTORE_ISSUER_ID }}",
                key_content: ENV['APPSTORE_API_PRIVATE_KEY'],
                duration: 1200,
                in_house: false
              )
              
              # Set up CI environment
              setup_ci
              
              # Run match to generate certificates and profiles
              match(
                type: "appstore",
                app_identifier: "$BUNDLE_ID",
                readonly: false,
                api_key: api_key,
                verbose: true
              )
            end
          end
          EOL
          
          # Run match first to generate certificates and profiles
          bundle exec fastlane sync_certs

      - name: Update project for manual signing with match profiles
        run: |
          cd ios
          cat > fix_project.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          
          # Get environment variables
          team_id = ENV['TEAM_ID']
          bundle_id = ENV['BUNDLE_ID']
          
          puts "Team ID: #{team_id}"
          puts "Bundle ID: #{bundle_id}"
          
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Update for manual signing with match profiles
          project.targets.each do |target|
            puts "Target: #{target.name}"
            target.build_configurations.each do |config|
              puts "Config: #{config.name}"
              
              # Set bundle ID
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
              
              # Set manual signing with match profile
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              config.build_settings['CODE_SIGN_IDENTITY'] = 'iPhone Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'iPhone Distribution'
              
              # Set the provisioning profile name as match creates it
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = "match AppStore #{bundle_id}"
            end
          end
          
          # Update root object attributes
          if project.root_object.attributes['TargetAttributes']
            project.root_object.attributes['TargetAttributes'].each do |target_id, attrs|
              attrs['ProvisioningStyle'] = 'Manual'
              attrs['DevelopmentTeam'] = team_id
            end
          end
          
          # Save the changes
          project.save
          puts "Project saved with manual signing settings using match profiles"
          EOL
          
          chmod +x fix_project.rb
          ruby fix_project.rb

      - name: Create build Fastfile
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios
          
          # Create Fastfile for building and uploading
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Set up App Store Connect API key
              api_key = app_store_connect_api_key(
                key_id: "${{ secrets.APPSTORE_API_KEY_ID }}",
                issuer_id: "${{ secrets.APPSTORE_ISSUER_ID }}",
                key_content: ENV['APPSTORE_API_PRIVATE_KEY'],
                duration: 1200,
                in_house: false
              )
              
              # Build the app
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                clean: true,
                output_directory: "./build",
                output_name: "Runner.ipa",
                export_method: "app-store",
                export_options: {
                  method: "app-store",
                  signingStyle: "manual",
                  provisioningProfiles: { 
                    "$BUNDLE_ID" => "match AppStore $BUNDLE_ID"
                  },
                  teamID: "$TEAM_ID"
                },
                skip_profile_detection: true
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true,
                ipa: "./build/Runner.ipa"
              )
            end
          end
          EOL

      - name: Flutter clean and rebuild
        run: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install

      - name: Deploy to TestFlight
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios
          # Explicitly set Xcode version
          sudo xcode-select -s /Applications/Xcode_15.4.app
          
          # Run fastlane
          bundle exec fastlane beta