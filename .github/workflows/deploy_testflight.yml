name: Deploy to TestFlight
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    env:
      BUNDLE_ID: "com.sai.moodPal"
      TEAM_ID: ${{ secrets.TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GITHUB_URL: ${{ secrets.MATCH_GITHUB_URL }}
      MATCH_GITHUB_TOKEN: ${{ secrets.MATCH_GITHUB_TOKEN }}
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      GIT_AUTHORIZATION: ${{ secrets.MATCH_GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        
      - name: Install Ruby gems
        run: |
          cd ios
          gem install bundler
          bundle init
          bundle add fastlane
          bundle add xcodeproj

      - name: Update project for automatic signing
        run: |
          cd ios
          cat > fix_project.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          
          # Get environment variables
          team_id = ENV['TEAM_ID']
          bundle_id = ENV['BUNDLE_ID']
          
          puts "Team ID: #{team_id}"
          puts "Bundle ID: #{bundle_id}"
          
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Update for automatic signing with specified team
          project.targets.each do |target|
            puts "Target: #{target.name}"
            target.build_configurations.each do |config|
              puts "Config: #{config.name}"
              
              # Set bundle ID
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
              
              # Reset existing code signing settings
              config.build_settings.delete('CODE_SIGN_IDENTITY')
              config.build_settings.delete('CODE_SIGN_IDENTITY[sdk=iphoneos*]')
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
              
              # Set automatic signing with team
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              
              # Ensure Xcode can handle distribution
              if config.name == 'Release'
                config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              end
            end
          end
          
          # Update root object attributes
          if project.root_object.attributes['TargetAttributes']
            project.root_object.attributes['TargetAttributes'].each do |target_id, attrs|
              attrs['ProvisioningStyle'] = 'Automatic'
              attrs['DevelopmentTeam'] = team_id
            end
          end
          
          # Save the changes
          project.save
          puts "Project saved with automatic signing settings"
          EOL
          
          chmod +x fix_project.rb
          ruby fix_project.rb

      - name: Setup fastlane with match
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios
          mkdir -p fastlane
          
          # Create Appfile
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_id("$FASTLANE_USER")
          team_id("$TEAM_ID")
          EOL
          
          # Create Matchfile
          cat > fastlane/Matchfile << EOL
          git_url("$MATCH_GITHUB_URL")
          storage_mode("git")
          type("appstore") # The default type, can be: appstore, adhoc, development, enterprise
          app_identifier("$BUNDLE_ID")
          username("$FASTLANE_USER")
          team_id("$TEAM_ID")
          
          # For all available options run `fastlane match --help`
          # Remove the # in the beginning of the line to enable the other options
          # The docs are available on https://docs.fastlane.tools/actions/match
          EOL
          
          # Create Fastfile with match
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Set up App Store Connect API key
              api_key = app_store_connect_api_key(
                key_id: "${{ secrets.APPSTORE_API_KEY_ID }}",
                issuer_id: "${{ secrets.APPSTORE_ISSUER_ID }}",
                key_content: ENV['APPSTORE_API_PRIVATE_KEY'],
                duration: 1200,
                in_house: false
              )
              
              # Set up code signing using match
              setup_ci if is_ci
              
              # Create or download certificates and profiles
              match(
                type: "appstore",
                app_identifier: "$BUNDLE_ID",
                readonly: false, # Set to true after the first run
                force_for_new_devices: true,
                generate_apple_certs: true,
                api_key: api_key
              )
              
              # Update code signing settings
              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                team_id: "$TEAM_ID",
                code_sign_identity: "iPhone Distribution",
                profile_name: "match AppStore $BUNDLE_ID",
                bundle_identifier: "$BUNDLE_ID"
              )
              
              # Build the app with manual signing via match
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                export_options: {
                  method: "app-store",
                  provisioningProfiles: { 
                    "$BUNDLE_ID" => "match AppStore $BUNDLE_ID"
                  },
                  teamID: "$TEAM_ID"
                }
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOL

      - name: Flutter clean and rebuild
        run: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install

      - name: Deploy to TestFlight
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios
          # Explicitly set Xcode version
          sudo xcode-select -s /Applications/Xcode_15.4.app
          
          # Run fastlane
          bundle exec fastlane beta