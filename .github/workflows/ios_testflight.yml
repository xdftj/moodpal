name: Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
        run: |
          echo -n "$IOS_DISTRIBUTION_CERTIFICATE" | base64 --decode > certificate.p12
          echo "Decoded certificate:"
          ls -l certificate.p12
          file certificate.p12

      - name: Import certificate into keychain
        env:
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temporary"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          # Import the certificate (no -f pkcs12 flag to let macOS auto-detect)
          security import certificate.p12 -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -k $KEYCHAIN_PATH

          # Use the new keychain
          security list-keychains -d user -s $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      - name: Upload to TestFlight
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          cd ios

          bundle init || true
          bundle add fastlane
          bundle install

          cat > fastlane/Fastfile << 'EOF'
          default_platform(:ios)

          platform :ios do
            desc "Deploy to TestFlight"
            lane :beta do
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                output_directory: "./build",
                output_name: "app.ipa"
              )

              upload_to_testflight(
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

          bundle exec fastlane beta
