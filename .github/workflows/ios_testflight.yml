name: Deploy to TestFlight
on:
  push:
    branches: [ main ]  # Change this to your main branch name if different
  workflow_dispatch:    # Allows manual triggering

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          BUNDLE_ID: "com.sai.moodpal"  # Replace with your app's bundle ID
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temporary"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Import certificate to keychain
          echo -n "$IOS_DISTRIBUTION_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          # Install provisioning profile using App Store Connect API
          cd ios
          
          # Install fastlane
          gem install fastlane

          # Set up App Store Connect API access
          mkdir -p ~/private_keys
          echo -n "$APPSTORE_API_PRIVATE_KEY" > ~/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8
          
          # Create Appfile with Apple Developer credentials
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_key_id("$APPSTORE_API_KEY_ID")
          apple_issuer_id("$APPSTORE_ISSUER_ID")
          apple_key_filepath("~/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8")
          EOL
          
          # Create or update Fastfile
          mkdir -p fastlane
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Deploy to TestFlight"
            lane :beta do
              # Update code signing settings
              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                code_sign_identity: "iPhone Distribution",
                bundle_identifier: "$BUNDLE_ID"
              )
              
              # Get provisioning profile
              get_provisioning_profile(
                app_identifier: "$BUNDLE_ID",
                force: true
              )
              
              # Build the app
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                output_directory: "./build",
                output_name: "moodpal.ipa"
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOL

      - name: Prepare Flutter iOS build
        run: |
          flutter build ios --release --no-codesign

      - name: Deploy to TestFlight
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: |
          cd ios
          bundle exec fastlane beta
