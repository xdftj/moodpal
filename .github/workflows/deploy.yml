name: Deploy to TestFlight
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      BUNDLE_ID: "com.sai.moodpal"
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        
      - name: Install Ruby gems
        run: |
          cd ios
          gem install bundler
          bundle init
          bundle add fastlane
          bundle add xcodeproj

      - name: Fix Xcode project
        run: |
          cd ios
          cat > fix_project.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          
          # Open the Xcode project
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Get your team ID from environment variable
          team_id = ENV['TEAM_ID']
          puts "Setting team ID to: #{team_id}"
          
          # Update the build settings to use the team ID
          project.targets.each do |target|
            puts "Updating target: #{target.name}"
            target.build_configurations.each do |config|
              puts "Updating config: #{config.name}"
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              config.build_settings['CODE_SIGN_IDENTITY'] = 'iPhone Distribution'
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'  # Changed to automatic
            end
          end
          
          # Save the changes
          project.save
          puts "Project saved successfully"
          EOL
          
          chmod +x fix_project.rb
          ruby fix_project.rb

      - name: Setup fastlane
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios
          mkdir -p fastlane
          
          # Create Appfile with credentials
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_id("$FASTLANE_USER")
          team_id("$TEAM_ID")
          itc_team_id("$TEAM_ID")
          EOL
          
          # Create a much simpler Fastfile that uses automatic signing
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Setup Xcode with automatic signing
              update_code_signing_settings(
                use_automatic_signing: true,
                path: "Runner.xcodeproj",
                team_id: "$TEAM_ID",
                code_sign_identity: "iPhone Distribution",
                bundle_identifier: "$BUNDLE_ID"
              )
              
              # Set up App Store Connect API key
              api_key = app_store_connect_api_key(
                key_id: "${{ secrets.APPSTORE_API_KEY_ID }}",
                issuer_id: "${{ secrets.APPSTORE_ISSUER_ID }}",
                key_content: ENV['APPSTORE_API_PRIVATE_KEY'],
                duration: 1200,
                in_house: false
              )
              
              # Setup CI
              setup_ci(
                force: true
              )
              
              # Build the app
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                skip_profile_detection: true,
                export_options: {
                  method: "app-store",
                  signingStyle: "automatic",
                  teamID: "$TEAM_ID"
                }
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOL

      - name: Flutter build
        run: flutter build ios --no-codesign

      - name: Deploy to TestFlight
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios
          bundle exec fastlane beta