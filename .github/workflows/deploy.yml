name: Deploy to TestFlight
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      BUNDLE_ID: "com.sai.moodPal"  # Corrected to match the exact case
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        
      - name: Install Ruby gems
        run: |
          cd ios
          gem install bundler
          bundle init
          bundle add fastlane
          bundle add xcodeproj

      - name: Fix project file
        run: |
          cd ios
          
          # Create script to fix code signing and bundle ID
          cat > update_project.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          
          # Get environment variables
          team_id = ENV['TEAM_ID']
          bundle_id = ENV['BUNDLE_ID']
          
          puts "Team ID: #{team_id}"
          puts "Bundle ID: #{bundle_id}"
          
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Set proper bundle ID and signing settings
          project.targets.each do |target|
            puts "Target: #{target.name}"
            target.build_configurations.each do |config|
              puts "Config: #{config.name}"
              
              # Set correct bundle ID
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
              
              # Set automatic signing
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
              
              # Remove any conflicting settings
              config.build_settings.delete('CODE_SIGN_IDENTITY')
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
            end
          end
          
          # Save the changes
          project.save
          puts "Project saved with updated bundle ID and signing settings"
          EOL
          
          chmod +x update_project.rb
          ruby update_project.rb

      - name: Create Fastfile with allowProvisioningUpdates
        run: |
          cd ios
          mkdir -p fastlane
          
          # Create a minimal Appfile
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_id("$FASTLANE_USER")
          team_id("$TEAM_ID")
          EOL
          
          # Create a Fastfile that uses allowProvisioningUpdates
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Set up App Store Connect API key
              api_key = app_store_connect_api_key(
                key_id: "${{ secrets.APPSTORE_API_KEY_ID }}",
                issuer_id: "${{ secrets.APPSTORE_ISSUER_ID }}",
                key_content: ENV['APPSTORE_API_PRIVATE_KEY'],
                duration: 1200,
                in_house: false
              )
              
              # Build the app with automatic signing and allow provisioning updates
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                export_options: {
                  method: "app-store",
                  signingStyle: "automatic",
                  teamID: "$TEAM_ID"
                },
                xcargs: "-allowProvisioningUpdates", # This is the key flag
                clean: true
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOL

      - name: Flutter clean and rebuild
        run: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install

      - name: Deploy to TestFlight
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios
          # Explicitly set Xcode version
          sudo xcode-select -s /Applications/Xcode_15.4.app
          
          # Run fastlane with minimal environment
          bundle exec fastlane beta