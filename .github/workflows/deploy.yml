name: Deploy to TestFlight
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        
      - name: Install Ruby gems
        run: |
          cd ios
          gem install bundler
          bundle init
          bundle add fastlane
          bundle add xcodeproj

      - name: Install Apple certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temporary"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Import certificate to keychain
          echo -n "$IOS_DISTRIBUTION_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Fix Xcode project
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd ios
          cat > fix_project.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          
          # Open the Xcode project
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Get your team ID from environment variable
          team_id = ENV['TEAM_ID']
          puts "Setting team ID to: #{team_id}"
          
          # Update the build settings to use the team ID
          project.targets.each do |target|
            puts "Updating target: #{target.name}"
            target.build_configurations.each do |config|
              puts "Updating config: #{config.name}"
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'iPhone Distribution'
            end
          end
          
          # Save the changes
          project.save
          puts "Project saved successfully"
          EOL
          
          chmod +x fix_project.rb
          ruby fix_project.rb

      - name: Setup fastlane
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          BUNDLE_ID: "com.sai.moodpal"
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd ios
          
          # Set up App Store Connect API access
          mkdir -p ~/private_keys
          echo -n "$APPSTORE_API_PRIVATE_KEY" > ~/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8
          
          # Create Appfile with credentials
          mkdir -p fastlane
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_id("${{ secrets.FASTLANE_USER }}")
          team_id("$TEAM_ID")
          itc_team_id("$TEAM_ID")
          apple_key_id("$APPSTORE_API_KEY_ID")
          apple_issuer_id("$APPSTORE_ISSUER_ID")
          apple_key_filepath("~/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8")
          EOL
          
          # Create Fastfile with deployment configuration
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              setup_ci
              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                team_id: "$TEAM_ID",
                code_sign_identity: "iPhone Distribution",
                profile_name: "AppStore $BUNDLE_ID",
                bundle_identifier: "$BUNDLE_ID"
              )
              
              # Get provisioning profile from App Store Connect
              get_provisioning_profile(
                app_identifier: "$BUNDLE_ID",
                team_id: "$TEAM_ID",
                force: true
              )
              
              # Build the app
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                export_options: {
                  provisioningProfiles: { 
                    "$BUNDLE_ID" => "AppStore $BUNDLE_ID"
                  }
                }
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOL

      - name: Flutter build
        run: flutter build ios --release --no-codesign

      - name: Deploy to TestFlight
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: |
          cd ios
          bundle exec fastlane beta