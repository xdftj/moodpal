name: Deploy to TestFlight
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      BUNDLE_ID: "com.sai.moodpal"
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        
      - name: Install Ruby gems
        run: |
          cd ios
          gem install bundler
          bundle init
          bundle add fastlane
          bundle add xcodeproj

      - name: Revoke old certificates first
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios
          
          # Create script to revoke certificates
          cat > revoke_certs.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'spaceship'
          
          # Login with API Key (more reliable than password)
          api_key = Spaceship::ConnectAPI::APIKey.new(
            key_id: ENV['APPSTORE_API_KEY_ID'],
            issuer_id: ENV['APPSTORE_ISSUER_ID'],
            key: ENV['APPSTORE_API_PRIVATE_KEY']
          )
          
          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(api_key)
          
          # Login to Portal
          Spaceship::Portal.login(ENV['FASTLANE_USER'], ENV['FASTLANE_PASSWORD'])
          Spaceship::Portal.select_team(team_id: ENV['TEAM_ID'])
          
          puts "Looking for distribution certificates to revoke..."
          
          # Get all distribution certificates
          certs = Spaceship::Portal.certificate.all.select do |cert|
            cert.name.include?("Distribution") || cert.name.include?("Distribu")
          end
          
          puts "Found #{certs.count} distribution certificates"
          
          if certs.count >= 3
            # Revoke all but the newest one
            certs_to_revoke = certs.sort_by(&:expires).reverse.drop(1)
            
            puts "Will revoke #{certs_to_revoke.count} certificates"
            
            certs_to_revoke.each do |cert|
              puts "Revoking certificate '#{cert.name}' (#{cert.id}) expiring on #{cert.expires}"
              begin
                cert.revoke!
                puts "Successfully revoked certificate #{cert.id}"
              rescue => e
                puts "Error revoking certificate: #{e.message}"
              end
            end
          else
            puts "Not enough certificates to require revocation. Will continue."
          end
          EOL
          
          chmod +x revoke_certs.rb
          APPSTORE_API_PRIVATE_KEY=${{ secrets.APPSTORE_API_PRIVATE_KEY }} ruby revoke_certs.rb

      - name: Fix Xcode project
        run: |
          cd ios
          cat > fix_project.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          
          # Open the Xcode project
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Get your team ID from environment variable
          team_id = ENV['TEAM_ID']
          puts "Setting team ID to: #{team_id}"
          
          # Update the build settings to use the team ID
          project.targets.each do |target|
            puts "Updating target: #{target.name}"
            target.build_configurations.each do |config|
              puts "Updating config: #{config.name}"
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'iPhone Distribution'
            end
          end
          
          # Save the changes
          project.save
          puts "Project saved successfully"
          EOL
          
          chmod +x fix_project.rb
          ruby fix_project.rb

      - name: Setup fastlane
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios
          mkdir -p fastlane
          
          # Create Appfile with credentials
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_id("$FASTLANE_USER")
          team_id("$TEAM_ID")
          itc_team_id("$TEAM_ID")
          EOL
          
          # Create Fastfile that uses match to download existing certificates rather than create new ones
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Set up code signing
              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                team_id: "$TEAM_ID",
                code_sign_identity: "iPhone Distribution",
                bundle_identifier: "$BUNDLE_ID"
              )
              
              # Set up App Store Connect API key
              api_key = app_store_connect_api_key(
                key_id: "${{ secrets.APPSTORE_API_KEY_ID }}",
                issuer_id: "${{ secrets.APPSTORE_ISSUER_ID }}",
                key_content: ENV['APPSTORE_API_PRIVATE_KEY'],
                duration: 1200,
                in_house: false
              )
              
              # Setup CI
              setup_ci(
                force: true
              )
              
              # IMPORTANT: Instead of creating a new certificate, use existing one
              # This just downloads existing certificates instead of creating new ones
              cert(
                api_key: api_key,
                development: false,
                force: false,
                generate_apple_certs: false
              )
              
              # Get provisioning profiles
              sigh(
                api_key: api_key,
                app_identifier: "$BUNDLE_ID",
                force: true
              )
              
              # Build the app
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store"
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOL

      - name: Flutter build
        run: flutter build ios --release --no-codesign

      - name: Deploy to TestFlight
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios
          bundle exec fastlane beta