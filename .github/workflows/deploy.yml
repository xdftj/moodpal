name: Deploy to TestFlight
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      BUNDLE_ID: "com.sai.moodpal"
      TEAM_ID: ${{ secrets.TEAM_ID }}
      KEYCHAIN_NAME: "ios-build.keychain"
      KEYCHAIN_PASSWORD: "temp_password"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        
      - name: Install Ruby gems
        run: |
          cd ios
          gem install bundler
          bundle init
          bundle add fastlane
          bundle add xcodeproj

      - name: Setup keychain
        run: |
          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security default-keychain -s $KEYCHAIN_NAME
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security set-keychain-settings -t 3600 -u $KEYCHAIN_NAME

      - name: Install certificate
        env:
          CERTIFICATE_DATA: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          # Create certificate file
          echo $CERTIFICATE_DATA | base64 --decode > certificate.p12
          
          # Import to keychain
          security import certificate.p12 -k $KEYCHAIN_NAME -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          
          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          
          # List identities to verify
          security find-identity -v -p codesigning $KEYCHAIN_NAME

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_DATA: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # Create the provisioning profiles directory if it doesn't exist
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Create provisioning profile
          echo $PROVISIONING_PROFILE_DATA | base64 --decode > profile.mobileprovision
          
          # Get UUID from profile
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          echo "Provisioning profile UUID: $PROFILE_UUID"
          
          # Install provisioning profile
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Update project settings
        run: |
          cd ios
          cat > fix_project.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          
          profile_uuid = ENV['PROFILE_UUID']
          team_id = ENV['TEAM_ID']
          bundle_id = ENV['BUNDLE_ID']
          
          puts "Using Profile UUID: #{profile_uuid}"
          puts "Using Team ID: #{team_id}"
          puts "Using Bundle ID: #{bundle_id}"
          
          # Open the Xcode project
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Update the build settings
          project.targets.each do |target|
            puts "Updating target: #{target.name}"
            target.build_configurations.each do |config|
              puts "Updating config: #{config.name}"
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'iPhone Distribution'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_uuid
            end
          end
          
          # Save the changes
          project.save
          puts "Project saved successfully"
          EOL
          
          chmod +x fix_project.rb
          ruby fix_project.rb

      - name: Setup fastlane
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios
          mkdir -p fastlane
          
          # Create Appfile with credentials
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_id("$FASTLANE_USER")
          team_id("$TEAM_ID")
          itc_team_id("$TEAM_ID")
          EOL
          
          # Create Fastfile - simplified to use manually installed certificate
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Setup API key
              api_key = app_store_connect_api_key(
                key_id: "${{ secrets.APPSTORE_API_KEY_ID }}",
                issuer_id: "${{ secrets.APPSTORE_ISSUER_ID }}",
                key_content: ENV['APPSTORE_API_PRIVATE_KEY'],
                duration: 1200,
                in_house: false
              )
              
              # Build the app using manually installed certificate and profile
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                export_options: {
                  method: "app-store",
                  signingStyle: "manual",
                  provisioningProfiles: { 
                    "$BUNDLE_ID" => ENV['PROFILE_UUID']
                  },
                  teamID: "$TEAM_ID"
                }
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOL

      - name: Flutter build
        run: flutter build ios --no-codesign

      - name: Deploy to TestFlight
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios
          bundle exec fastlane beta