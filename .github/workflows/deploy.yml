name: Deploy to TestFlight
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      BUNDLE_ID: "com.sai.moodpal"
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        
      - name: Install Ruby gems
        run: |
          cd ios
          gem install bundler
          bundle init
          bundle add fastlane
          bundle add xcodeproj

      - name: Update project.pbxproj directly
        run: |
          cd ios
          cat > modify_project.rb << 'EOL'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          
          # Open the Xcode project
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Get environment variables
          team_id = ENV['TEAM_ID']
          bundle_id = ENV['BUNDLE_ID']
          
          puts "Setting Team ID: #{team_id}"
          puts "Using Bundle ID: #{bundle_id}"
          
          # Update all targets
          project.targets.each do |target|
            puts "Processing target: #{target.name}"
            
            # Update build configurations
            target.build_configurations.each do |config|
              puts "  Updating configuration: #{config.name}"
              
              # Set team ID
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              
              # Use automatic signing
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
              
              # For app store distribution
              if config.name == 'Release'
                config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              else
                config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Development'
              end
              
              # Clear any existing provisioning profile settings to avoid conflicts
              config.build_settings.delete('PROVISIONING_PROFILE')
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
            end
          end
          
          # Update project attributes
          if project.root_object.attributes['TargetAttributes']
            project.root_object.attributes['TargetAttributes'].each do |target_id, attrs|
              puts "Setting provisioning style for target ID: #{target_id}"
              attrs['ProvisioningStyle'] = 'Automatic'
            end
          end
          
          # Save changes
          project.save
          puts "Project updated successfully"
          EOL
          
          chmod +x modify_project.rb
          ruby modify_project.rb

      - name: Setup fastlane
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios
          mkdir -p fastlane
          
          # Create Appfile with credentials
          cat > fastlane/Appfile << EOL
          app_identifier("$BUNDLE_ID")
          apple_id("$FASTLANE_USER")
          team_id("$TEAM_ID")
          itc_team_id("$TEAM_ID")
          EOL
          
          # Create simplified Fastfile that uses App Store Connect API key
          cat > fastlane/Fastfile << EOL
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Setup API key for TestFlight upload
              api_key = app_store_connect_api_key(
                key_id: "${{ secrets.APPSTORE_API_KEY_ID }}",
                issuer_id: "${{ secrets.APPSTORE_ISSUER_ID }}",
                key_content: ENV['APPSTORE_API_PRIVATE_KEY'],
                duration: 1200,
                in_house: false
              )
              
              # Make absolutely sure we're using automatic signing
              update_code_signing_settings(
                use_automatic_signing: true,
                path: "Runner.xcodeproj",
                team_id: "$TEAM_ID",
                targets: "Runner",
                code_sign_identity: "Apple Distribution",
                bundle_identifier: "$BUNDLE_ID"
              )
              
              # Build the app
              gym(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                configuration: "Release",
                export_method: "app-store",
                export_options: {
                  method: "app-store",
                  signingStyle: "automatic",
                  teamID: "$TEAM_ID"
                },
                include_symbols: true,
                include_bitcode: false,
                skip_profile_detection: true
              )
              
              # Upload to TestFlight
              pilot(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOL

      - name: Flutter build
        run: flutter build ios --no-codesign

      - name: Deploy to TestFlight
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios
          # Explicitly use xcode-select to make sure the right version is used
          sudo xcode-select -s /Applications/Xcode_15.4.app
          
          # Run fastlane
          bundle exec fastlane beta