name: mood_pal
description: Your emotionally-aware mood tracking sidekick.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State management
  provider: ^6.0.5
  
  # UI packages
  google_fonts: ^5.1.0
  intl: ^0.18.1
  
  # Local storage
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  
  # Audio
  record: ^4.4.4
  flutter_sound: ^9.2.13
  permission_handler: ^10.4.3
  
  # Utilities
  url_launcher: ^6.1.12
  package_info_plus: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/creatures/
  
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300