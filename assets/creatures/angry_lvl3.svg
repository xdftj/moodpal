<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFCDD2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)"/>
  <!-- Main body -->
  <circle cx="100" cy="100" r="70" fill="#FF6B6B"/>
  <!-- Eyebrows -->
  <path d="M 55 60 L 85 75" stroke="#000000" stroke-width="5" fill="none"/>
  <path d="M 145 60 L 115 75" stroke="#000000" stroke-width="5" fill="none"/>
  <!-- Eyes -->
  <circle cx="75" cy="85" r="12" fill="#FFFFFF"/>
  <circle cx="125" cy="85" r="12" fill="#FFFFFF"/>
  <circle cx="75" cy="85" r="6" fill="#000000"/>
  <circle cx="125" cy="85" r="6" fill="#000000"/>
  <!-- Mouth -->
  <path d="M 70 125 L 130 125" stroke="#000000" stroke-width="5" fill="none"/>
  <path d="M 70 125 L 70 140" stroke="#000000" stroke-width="5" fill="none"/>
  <path d="M 130 125 L 130 140" stroke="#000000" stroke-width="5" fill="none"/>
  <path d="M 85 125 L 85 145" stroke="#000000" stroke-width="5" fill="none"/>
  <path d="M 115 125 L 115 145" stroke="#000000" stroke-width="5" fill="none"/>
  <!-- Pointy ears -->
  <path d="M 65 45 L 40 20 L 50 70 Z" fill="#FF6B6B"/>
  <path d="M 135 45 L 160 20 L 150 70 Z" fill="#FF6B6B"/>
  <!-- Fire/smoke effect -->
  <path d="M 85 35 Q 100 10 115 35" fill="#FFAB91"/>
  <path d="M 90 30 Q 100 15 110 30" fill="#FF8A65"/>
  <!-- Pointy tail -->
  <path d="M 100 150 L 85 180 L 115 180 Z" fill="#FF6B6B"/>
  <!-- Level 3 indicator -->
  <circle cx="175" cy="25" r="15" fill="#FF6B6B" stroke="#000000" stroke-width="2"/>
  <text x="175" y="30" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000">3</text>
</svg>