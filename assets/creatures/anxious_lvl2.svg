<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFE0B2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF9F45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="85" fill="url(#glow)"/>
  <!-- Main body -->
  <circle cx="100" cy="100" r="65" fill="#FF9F45"/>
  <!-- Jittery outline effect -->
  <path d="M 35 100 Q 40 80 45 100" stroke="#FF9F45" stroke-width="2" fill="none"/>
  <path d="M 155 100 Q 160 80 165 100" stroke="#FF9F45" stroke-width="2" fill="none"/>
  <path d="M 100 35 Q 80 40 100 45" stroke="#FF9F45" stroke-width="2" fill="none"/>
  <path d="M 100 155 Q 80 160 100 165" stroke="#FF9F45" stroke-width="2" fill="none"/>
  <!-- Eyes -->
  <circle cx="75" cy="85" r="12" fill="#FFFFFF"/>
  <circle cx="125" cy="85" r="12" fill="#FFFFFF"/>
  <circle cx="71" cy="81" r="6" fill="#000000"/>
  <circle cx="121" cy="81" r="6" fill="#000000"/>
  <!-- Mouth -->
  <path d="M 85 115 L 115 115" stroke="#000000" stroke-width="3" fill="none"/>
  <path d="M 85 115 Q 90 120 95 115" stroke="#000000" stroke-width="1" fill="none"/>
  <path d="M 105 115 Q 110 120 115 115" stroke="#000000" stroke-width="1" fill="none"/>
  <!-- Sweat drops -->
  <path d="M 140 70 Q 143 85 140 100" fill="#FFFFFF"/>
  <path d="M 60 70 Q 57 85 60 100" fill="#FFFFFF"/>
  <!-- Small antennae -->
  <path d="M 85 40 Q 80 30 75 25" stroke="#FF9F45" stroke-width="5" fill="none"/>
  <path d="M 115 40 Q 120 30 125 25" stroke="#FF9F45" stroke-width="5" fill="none"/>
  <!-- Level 2 indicator -->
  <circle cx="175" cy="25" r="15" fill="#FF9F45" stroke="#000000" stroke-width="2"/>
  <text x="175" y="30" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000">2</text>
</svg>