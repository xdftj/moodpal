<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#D1C4E9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9D8DF1" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)"/>
  <!-- Main body -->
  <circle cx="100" cy="100" r="70" fill="#9D8DF1"/>
  <!-- Eyes -->
  <path d="M 60 80 L 90 90" stroke="#000000" stroke-width="4" fill="none"/>
  <path d="M 60 90 L 90 80" stroke="#000000" stroke-width="4" fill="none"/>
  <path d="M 110 80 L 140 90" stroke="#000000" stroke-width="4" fill="none"/>
  <path d="M 110 90 L 140 80" stroke="#000000" stroke-width="4" fill="none"/>
  <!-- Mouth -->
  <path d="M 80 120 L 120 120" stroke="#000000" stroke-width="4" fill="none"/>
  <!-- Z's (sleeping) -->
  <text x="130" y="50" font-family="Arial" font-size="28" font-weight="bold" fill="#7C69EE">Z</text>
  <text x="145" y="65" font-family="Arial" font-size="20" font-weight="bold" fill="#7C69EE">z</text>
  <text x="155" y="75" font-family="Arial" font-size="14" font-weight="bold" fill="#7C69EE">z</text>
  <!-- Droopy body parts -->
  <path d="M 40 100 Q 20 120 10 130" stroke="#9D8DF1" stroke-width="12" fill="none"/>
  <path d="M 160 100 Q 180 120 190 130" stroke="#9D8DF1" stroke-width="12" fill="none"/>
  <!-- Droopy bottom -->
  <path d="M 85 160 Q 70 180 50 185" stroke="#9D8DF1" stroke-width="12" fill="none"/>
  <path d="M 115 160 Q 130 180 150 185" stroke="#9D8DF1" stroke-width="12" fill="none"/>
  <!-- Sleep mask partially lifted -->
  <path d="M 55 65 Q 100 50 145 65" stroke="#5E35B1" stroke-width="8" fill="none"/>
  <!-- Pillow -->
  <path d="M 100 140 Q 70 150 60 180 Q 100 190 140 180 Q 130 150 100 140 Z" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="2"/>
  <!-- Level 3 indicator -->
  <circle cx="175" cy="25" r="15" fill="#9D8DF1" stroke="#000000" stroke-width="2"/>
  <text x="175" y="30" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000">3</text>
</svg>