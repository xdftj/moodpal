<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#C8E6C9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#88D8B0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="85" fill="url(#glow)"/>
  <!-- Main body -->
  <circle cx="100" cy="100" r="65" fill="#88D8B0"/>
  <!-- Eyes (closed, peaceful) -->
  <path d="M 70 85 Q 80 80 90 85" stroke="#000000" stroke-width="3" fill="none"/>
  <path d="M 110 85 Q 120 80 130 85" stroke="#000000" stroke-width="3" fill="none"/>
  <!-- Mouth -->
  <path d="M 85 110 Q 100 120 115 110" stroke="#000000" stroke-width="3" fill="none"/>
  <!-- Flippers -->
  <path d="M 45 100 Q 30 90 35 70" stroke="#88D8B0" stroke-width="10" fill="none"/>
  <path d="M 155 100 Q 170 90 165 70" stroke="#88D8B0" stroke-width="10" fill="none"/>
  <!-- Aura lines -->
  <path d="M 30 70 Q 50 65 30 60" stroke="#C8E6C9" stroke-width="2" fill="none"/>
  <path d="M 30 100 Q 50 95 30 90" stroke="#C8E6C9" stroke-width="2" fill="none"/>
  <path d="M 30 130 Q 50 125 30 120" stroke="#C8E6C9" stroke-width="2" fill="none"/>
  <path d="M 170 70 Q 150 65 170 60" stroke="#C8E6C9" stroke-width="2" fill="none"/>
  <path d="M 170 100 Q 150 95 170 90" stroke="#C8E6C9" stroke-width="2" fill="none"/>
  <path d="M 170 130 Q 150 125 170 120" stroke="#C8E6C9" stroke-width="2" fill="none"/>
  <!-- Level 2 indicator -->
  <circle cx="175" cy="25" r="15" fill="#88D8B0" stroke="#000000" stroke-width="2"/>
  <text x="175" y="30" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000">2</text>
</svg>