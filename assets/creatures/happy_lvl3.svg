<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFEB3B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)"/>
  <!-- Main body -->
  <circle cx="100" cy="100" r="70" fill="#FFD700"/>
  <!-- Eyes -->
  <circle cx="75" cy="80" r="15" fill="#FFFFFF"/>
  <circle cx="125" cy="80" r="15" fill="#FFFFFF"/>
  <circle cx="75" cy="80" r="7" fill="#000000"/>
  <circle cx="125" cy="80" r="7" fill="#000000"/>
  <!-- Mouth -->
  <path d="M 65 115 Q 100 155 135 115" stroke="#000000" stroke-width="6" fill="#FF6B6B"/>
  <!-- Little arms -->
  <path d="M 50 100 Q 20 90 15 60" stroke="#FFD700" stroke-width="12" fill="none"/>
  <path d="M 150 100 Q 180 90 185 60" stroke="#FFD700" stroke-width="12" fill="none"/>
  <!-- Little legs -->
  <path d="M 80 160 Q 70 180 50 185" stroke="#FFD700" stroke-width="12" fill="none"/>
  <path d="M 120 160 Q 130 180 150 185" stroke="#FFD700" stroke-width="12" fill="none"/>
  <!-- Crown/accessory -->
  <path d="M 70 40 L 85 60 L 100 40 L 115 60 L 130 40" fill="#FFB74D" stroke="#FF9800" stroke-width="2"/>
  <!-- Level 3 indicator -->
  <circle cx="175" cy="25" r="15" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <text x="175" y="30" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000">3</text>
</svg>