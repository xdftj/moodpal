  <path d="M 75 125 L 125 125 Z" stroke="#000000" stroke-width="4" fill="none"/>
  <path d="M 85 125 L 85 135" stroke="#000000" stroke-width="4" fill="none"/>
  <path d="M 115 125 L 115 135" stroke="#000000" stroke-width="4" fill="none"/>
  <!-- Pointy ears -->
  <path d="M 65 45 L 50 30 L 55 60 Z" fill="#FF6B6B"/>
  <path d="M 135 45 L 150 30 L 145 60 Z" fill="#FF6B6B"/>
  <!-- Level 2 indicator -->
  <circle cx="175" cy="25" r="15" fill="#FF6B6B" stroke="#000000" stroke-width="2"/>
