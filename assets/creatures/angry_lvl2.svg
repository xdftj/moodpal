  <circle cx="75" cy="85" r="10" fill="#FFFFFF"/>
  <circle cx="125" cy="85" r="10" fill="#FFFFFF"/>
  <circle cx="75" cy="85" r="5" fill="#000000"/>
  <circle cx="125" cy="85" r="5" fill="#000000"/>
