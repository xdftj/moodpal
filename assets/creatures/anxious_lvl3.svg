<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFE0B2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF9F45" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)"/>
  <!-- Main body -->
  <circle cx="100" cy="100" r="70" fill="#FF9F45"/>
  <!-- Jittery outline effect -->
  <path d="M 30 100 Q 35 75 40 100 Q 45 125 50 100" stroke="#FF9F45" stroke-width="3" fill="none"/>
  <path d="M 150 100 Q 155 75 160 100 Q 165 125 170 100" stroke="#FF9F45" stroke-width="3" fill="none"/>
  <path d="M 100 30 Q 75 35 100 40 Q 125 45 100 50" stroke="#FF9F45" stroke-width="3" fill="none"/>
  <path d="M 100 150 Q 75 155 100 160 Q 125 165 100 170" stroke="#FF9F45" stroke-width="3" fill="none"/>
  <!-- Eyes -->
  <circle cx="75" cy="85" r="15" fill="#FFFFFF"/>
  <circle cx="125" cy="85" r="15" fill="#FFFFFF"/>
  <circle cx="70" cy="80" r="8" fill="#000000"/>
  <circle cx="120" cy="80" r="8" fill="#000000"/>
  <!-- Mouth -->
  <path d="M 80 115 L 120 115" stroke="#000000" stroke-width="4" fill="none"/>
  <path d="M 80 115 Q 90 125 100 115" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M 100 115 Q 110 125 120 115" stroke="#000000" stroke-width="2" fill="none"/>
  <!-- Sweat drops -->
  <path d="M 145 65 Q 150 85 145 105" fill="#FFFFFF"/>
  <path d="M 55 65 Q 50 85 55 105" fill="#FFFFFF"/>
  <path d="M 100 145 Q 105 165 100 185" fill="#FFFFFF"/>
  <!-- Jittery antennae -->
  <path d="M 80 35 Q 70 25 75 15 Q 80 10 85 15" stroke="#FF9F45" stroke-width="6" fill="none"/>
  <path d="M 120 35 Q 130 25 125 15 Q 120 10 115 15" stroke="#FF9F45" stroke-width="6" fill="none"/>
  <!-- Worry lines -->
  <path d="M 50 65 L 65 70" stroke="#CC6E1B" stroke-width="2" fill="none"/>
  <path d="M 50 75 L 65 80" stroke="#CC6E1B" stroke-width="2" fill="none"/>
  <path d="M 150 65 L 135 70" stroke="#CC6E1B" stroke-width="2" fill="none"/>
  <path d="M 150 75 L 135 80" stroke="#CC6E1B" stroke-width="2" fill="none"/>
  <!-- Level 3 indicator -->
  <circle cx="175" cy="25" r="15" fill="#FF9F45" stroke="#000000" stroke-width="2"/>
  <text x="175" y="30" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000">3</text>
</svg>